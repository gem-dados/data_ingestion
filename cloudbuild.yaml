# =============================================================================
# Esteira do data_ingestion: build da imagem -> Artifact Registry -> deploy
# no Cloud Run. Branch por ambiente (igual ao cloud_iac):
#   push 'stg'  -> _ENV=stg  -> projeto gem-dados-lake-stg
#   push 'main' -> _ENV=prd  -> projeto gem-dados-lake-prd
#
# A infra (Artifact Registry, servico Cloud Run, SA) ja foi criada pelo
# cloud_iac. Aqui so publicamos a imagem e atualizamos o servico.
# =============================================================================
substitutions:
  _ENV: stg
  _REGION: us-central1
  _REPO: data-ingestion
  _SERVICE: data-ingestion

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"

steps:
  # 1) Guardrail: segredo commitado
  - id: gitleaks
    name: zricethezav/gitleaks:latest
    args: ["detect", "--source=.", "--no-banner", "--redact", "--verbose"]

  # 2) Testes antes de publicar imagem. Nao faz sentido subir artefato que nao
  #    passou no teste — e o smoke de import pega quebra de entrypoint.
  - id: pytest
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --no-cache-dir --quiet -r requirements-dev.txt
        python -m pytest tests/ -q

  # 3) Build
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"
      - .

  # 4) Smoke DA IMAGEM: importa o entrypoint dentro do container recem-criado.
  #    O pytest roda na raiz do repo, onde 'src' sempre resolve — ele nao pega
  #    erro de layout da imagem (ex.: um COPY que achata o pacote). Este passo
  #    pega, e impede que imagem quebrada chegue no Artifact Registry.
  - id: smoke-imagem
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --entrypoint=python
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"
      - -c
      - "from src.main import app; print('smoke ok: entrypoint carregou')"

  # 5) Push
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"

  # 6) Deploy no Cloud Run (servico ja existe, criado pelo cloud_iac)
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
      - --region=${_REGION}
      - --project=${PROJECT_ID}
      - --no-allow-unauthenticated
